name: Compilation Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3

      - name: Compiler l'exécutable
        run: pyinstaller supervision.spec --noconfirm

      - name: Lire le numéro de version
        id: ver
        shell: bash
        run: echo "v=$(grep -oP '^VERSION = \"\K[^\"]+' supervision/app.py)" >> "$GITHUB_OUTPUT"

      - name: Publier l'exécutable (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: Supervision-ADRASEC06-Windows
          path: dist/Supervision-ADRASEC06.exe

      - name: Publier la version (release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Supervision ADRASEC 06 v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: dist/Supervision-ADRASEC06.exe
          make_latest: true
          body: |
            Téléchargez **Supervision-ADRASEC06.exe** ci-dessous et lancez-le.
            Les données restent dans %APPDATA%\ADRASEC06-Supervision.
